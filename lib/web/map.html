<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
        <style>#map { height: 100vh; } body { margin: 0; }</style>
    </head>
    <body>
        <div id="map"></div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
        <script>
            const map = L.map('map').setView([41.894, 12.469], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            const drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);

            const drawControl = new L.Control.Draw({
                draw: {
                    polygon: {
                        allowIntersection: false,
                        showArea: true,
                        metric: true,
                        finishOnDoubleClick: false
                    },
                    circlemarker: false,
                    marker: false,
                    polyline: false,
                    circle: false,
                    rectangle: false
                },
                edit: { featureGroup: drawnItems }
            });
            map.addControl(drawControl);

            map.on(L.Draw.Event.CREATED, async (e) => {
                drawnItems.addLayer(e.layer);

                const points = e.layerType === 'marker'
                    ? `${e.layer.getLatLng().lat},${e.layer.getLatLng().lng}`
                    : e.layer.getLatLngs()[0].map(p => `${p.lat},${p.lng}`).join('\n');

                const name = prompt("Name this location:");
                if (!name) return;

                await fetch('/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, points })
                });
                alert("Saved!");
            });
        </script>
    </body>
</html>
